<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- bundled 2026-11-17 23:39 KST · offline single-file build -->
<title>SEOUL SCAN — K-beauty trends, read straight from Korean comments</title>
<meta name="description" content="An English-language K-beauty magazine for US readers. Every story is built from a real Korean YouTube video, its Korean comments, and what those comments actually say." />
<style>
  :root{
    --ink:#17140f;
    --ink-soft:#403a33;
    --muted:#7a736a;
    --paper:#fbf8f3;
    --card:#ffffff;
    --line:#e8e1d5;
    --coral:#d8492f;
    --coral-soft:#fdece7;
    --sage:#2f6b52;
    --sage-soft:#e7f1eb;
    --lilac:#6b5bd2;
    --lilac-soft:#eeebfb;
    --amber:#a86b12;
    --pos:#2f6b52;
    --neg:#c2452f;
    --ad:#8a7bd8;
    --radius:18px;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{overflow-anchor:none}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  img{max-width:100%}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  /* ---------- masthead ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(251,248,243,.88);
    backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{display:flex;align-items:center;gap:18px;height:64px}
  .logo{
    display:flex;align-items:baseline;gap:9px;
    font-family:var(--serif);letter-spacing:-.01em;
    cursor:pointer;background:none;border:0;padding:0;color:inherit;
  }
  .logo .mark{
    width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#ff9d7a,var(--coral) 62%,#8f2a17);
    display:inline-block;flex:0 0 auto;transform:translateY(2px);
    box-shadow:0 0 0 4px rgba(216,73,47,.10);
  }
  .logo strong{font-size:23px;font-weight:700;letter-spacing:.14em}
  .logo span.tag{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .topbar nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
  .topbar nav::-webkit-scrollbar{display:none}
  .tab{
    border:0;background:transparent;color:var(--ink-soft);
    font-family:var(--sans);font-size:13.5px;letter-spacing:.02em;
    padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;
    transition:background .18s ease,color .18s ease;
  }
  .tab:hover{background:#f1ece2}
  .tab[aria-selected="true"]{background:var(--ink);color:#fff}
  .topbar .sub{
    margin-left:8px;border:1px solid var(--ink);border-radius:999px;background:transparent;
    padding:8px 16px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:var(--sans);
  }
  .topbar .sub:hover{background:var(--ink);color:#fff}

  /* ---------- lead ---------- */
  .edition{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    padding:22px 0 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)
  }
  .edition .dot{width:5px;height:5px;border-radius:50%;background:var(--coral);display:inline-block;margin:0 8px;transform:translateY(-2px)}
  .hero{
    display:grid;grid-template-columns:1.15fr .85fr;gap:34px;align-items:center;
    padding:26px 0 34px;border-bottom:1px solid var(--line)
  }
  .kicker{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--coral);font-weight:700}
  .hero h1{
    font-family:var(--serif);font-weight:600;letter-spacing:-.022em;line-height:1.05;
    font-size:clamp(34px,4.7vw,60px);margin:12px 0 14px
  }
  .hero h1 em{font-style:italic;color:var(--coral)}
  .hero p.dek{font-size:17.5px;color:var(--ink-soft);max-width:52ch;margin:0 0 22px;line-height:1.62}
  .hero .meta{display:flex;flex-wrap:wrap;gap:10px}
  .pill{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);
    border-radius:999px;padding:7px 13px;font-size:12.5px;color:var(--ink-soft)
  }
  .pill b{font-weight:600;color:var(--ink)}
  .hero-art{
    aspect-ratio:4/3;border-radius:24px;position:relative;overflow:hidden;
    background:
      radial-gradient(120% 90% at 15% 10%,#ffe3d6 0%,transparent 55%),
      radial-gradient(100% 100% at 90% 20%,#e9e2ff 0%,transparent 60%),
      linear-gradient(160deg,#fdf1ea,#efe7f8 60%,#e7f1ec);
    border:1px solid var(--line);
    display:grid;place-items:center;
  }
  .hero-art .big{font-size:clamp(70px,10vw,132px);filter:drop-shadow(0 16px 26px rgba(23,20,15,.14))}
  .hero-art .stamp{
    position:absolute;left:18px;bottom:16px;background:rgba(255,255,255,.86);
    border:1px solid rgba(23,20,15,.10);border-radius:12px;padding:8px 12px;font-size:11.5px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);backdrop-filter:blur(6px)
  }
  .btn{
    display:inline-flex;align-items:center;gap:9px;border:0;border-radius:999px;cursor:pointer;
    padding:13px 22px;font-size:14.5px;font-weight:600;font-family:var(--sans);
    background:var(--ink);color:#fff;transition:transform .16s ease,background .16s ease;
    text-decoration:none
  }
  .btn:hover{transform:translateY(-1px);background:#000}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:#fff}
  .btn.coral{background:var(--coral)}
  .btn.coral:hover{background:#bf3d26}

  /* ---------- grid ---------- */
  .section-head{display:flex;align-items:baseline;gap:14px;margin:40px 0 18px}
  .section-head h2{font-family:var(--serif);font-size:26px;margin:0;letter-spacing:-.01em}
  .section-head .rule{flex:1;height:1px;background:var(--line)}
  .section-head .count{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(23,20,15,.09);border-color:#dbd2c2}
  .card .thumb{
    aspect-ratio:16/10;display:grid;place-items:center;font-size:52px;
    background:linear-gradient(150deg,#fdf0e9,#f2ecfb 55%,#e8f2ec);
    border-bottom:1px solid var(--line);position:relative
  }
  .card .thumb .cat{
    position:absolute;left:12px;top:12px;background:rgba(255,255,255,.9);border-radius:999px;
    padding:4px 10px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)
  }
  .card .body{padding:16px 17px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card h3{font-family:var(--serif);font-size:20.5px;line-height:1.24;margin:0;letter-spacing:-.012em;font-weight:600}
  .card p{margin:0;font-size:13.6px;color:var(--muted);line-height:1.55}
  .card .foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
  .meter-mini{display:flex;height:6px;border-radius:99px;overflow:hidden;background:#f0ece4;margin-top:2px}
  .meter-mini i{display:block;height:100%}
  .meter-mini i.p{background:var(--pos)}
  .meter-mini i.n{background:var(--neg)}
  .meter-mini i.a{background:var(--ad)}

  /* ---------- article ---------- */
  .article{max-width:820px;margin:0 auto;padding:34px 0 10px}
  .backlink{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);
    background:none;border:0;cursor:pointer;padding:0;margin-bottom:22px;font-family:var(--sans)
  }
  .backlink:hover{color:var(--ink)}
  .article h1{
    font-family:var(--serif);font-size:clamp(30px,4.4vw,46px);line-height:1.1;
    letter-spacing:-.024em;margin:10px 0 16px;font-weight:600
  }
  .article .dek{font-size:18px;color:var(--ink-soft);line-height:1.6;margin:0 0 24px}
  .byline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:30px}
  .byline .src{font-size:12.5px;color:var(--muted)}
  .byline .src b{color:var(--ink);font-weight:600}

  .block{margin:0 0 34px}
  .block-head{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .block-head .n{
    width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;flex:0 0 auto
  }
  .block-head h2{
    font-family:var(--sans);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
    margin:0;color:var(--ink);font-weight:700
  }
  .takeaway{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 8px;
  }
  .takeaway dl{display:grid;grid-template-columns:132px 1fr;gap:0;margin:0}
  .takeaway dt{
    font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    padding:12px 0;border-top:1px solid var(--line)
  }
  .takeaway dd{margin:0;padding:12px 0;border-top:1px solid var(--line);font-size:14.6px;line-height:1.6}
  .takeaway dl > :nth-child(1),.takeaway dl > :nth-child(2){border-top:0}

  .meter-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .meter-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
  .meter-top .big{font-family:var(--serif);font-size:34px;line-height:1;letter-spacing:-.02em}
  .meter-top .big small{font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.06em;margin-left:8px}
  .bar{display:flex;height:26px;border-radius:10px;overflow:hidden;background:#f1ece3}
  .bar i{display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#fff;font-weight:600;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .bar i.p{background:var(--pos)}
  .bar i.n{background:var(--neg)}
  .bar i.a{background:var(--ad)}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:12.5px;color:var(--ink-soft)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .meter-note{margin:14px 0 0;font-size:13px;color:var(--muted);line-height:1.6}

  .quotes{display:grid;gap:14px}
  .quote{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    border-left:3px solid var(--pos)
  }
  .quote[data-tone="critical"]{border-left-color:var(--neg)}
  .quote[data-tone="ad-skeptic"]{border-left-color:var(--ad)}
  .quote .ko{font-size:14.5px;line-height:1.6;color:var(--ink);margin:0 0 10px;white-space:pre-line}
  .quote .en{font-size:14.5px;line-height:1.62;color:var(--ink-soft);margin:0;font-style:italic}
  .quote .meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;font-size:11.5px;color:var(--muted)}
  .chip{
    display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;
    background:var(--sage-soft);color:var(--sage);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700
  }
  .chip.critical{background:var(--coral-soft);color:var(--neg)}
  .chip.ad{background:var(--lilac-soft);color:#5748b5}
  .quote .note{margin:10px 0 0;font-size:12px;color:var(--muted);font-style:normal}

  .buy{display:grid;gap:12px}
  .buy-item{
    display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px
  }
  .buy-item .nm{flex:1;min-width:0}
  .buy-item .nm b{display:block;font-size:15px;font-weight:600;line-height:1.35}
  .buy-item .nm span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .buy-item .nm em{display:block;font-size:12px;color:var(--ink-soft);margin-top:5px;font-style:normal}
  .buy-item .go{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    background:var(--coral);color:#fff;border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:600
  }
  .buy-item .go:hover{background:#bf3d26}
  .caveat{
    margin-top:14px;border:1px dashed #d8cdb9;background:#fffaf0;border-radius:12px;padding:13px 15px;
    font-size:13.2px;color:#6d5217;line-height:1.6
  }
  .aff-note{margin:10px 0 0;font-size:11.5px;color:var(--muted)}

  .source-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden
  }
  .source-card .row{display:flex;flex-wrap:wrap;gap:14px;padding:16px 18px;align-items:center}
  .source-card .row + .row{border-top:1px solid var(--line)}
  .source-card .thumb-sm{
    width:78px;height:58px;border-radius:10px;background:linear-gradient(150deg,#ffe6da,#eee8fd);
    display:grid;place-items:center;font-size:24px;flex:0 0 auto;border:1px solid var(--line)
  }
  .source-card .t{flex:1;min-width:180px}
  .source-card .t b{display:block;font-size:14.5px;line-height:1.4}
  .source-card .t span{font-size:12.5px;color:var(--muted)}
  .embed{position:relative;padding-top:56.25%;background:#17140f}
  .embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .embed-facade{
    position:absolute;inset:0;width:100%;height:100%;border:0;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    color:#fff;font-family:var(--sans);
    background:
      radial-gradient(80% 90% at 20% 15%,rgba(255,157,122,.35),transparent 60%),
      radial-gradient(90% 90% at 85% 80%,rgba(140,120,235,.35),transparent 60%),
      linear-gradient(140deg,#241f19,#3a2f26 60%,#2a2038);
  }
  .embed-facade:hover .embed-play{transform:scale(1.06);background:var(--coral)}
  .embed-play{
    width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.45);display:grid;place-items:center;font-size:20px;
    transition:transform .18s ease,background .18s ease;padding-left:4px
  }
  .embed-label{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85)}
  .quality{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;border-top:1px solid var(--line);background:#fcfaf6}
  .quality span{font-size:11px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:#fff}

  .bodycopy p{font-size:16.5px;line-height:1.75;color:#241f19;margin:0 0 16px}
  .bodycopy p:first-child::first-letter{
    float:left;font-family:var(--serif);font-size:56px;line-height:.82;padding:6px 10px 0 0;color:var(--coral)
  }

  .next{display:flex;gap:14px;flex-wrap:wrap;margin:36px 0 10px}

  /* ---------- newsletter ---------- */
  .newsletter{
    margin:56px 0 0;border-radius:26px;padding:34px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#1d1a15,#312a22 55%,#4a2f26);
  }
  .newsletter:after{
    content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,157,122,.55),rgba(216,73,47,0) 70%)
  }
  .newsletter h3{font-family:var(--serif);font-size:29px;margin:0 0 8px;letter-spacing:-.01em}
  .newsletter p{margin:0 0 20px;font-size:14.5px;color:#e8e0d6;max-width:46ch;line-height:1.6}
  .nl-form{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
  .nl-form input{
    flex:1;min-width:220px;border-radius:999px;border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.10);color:#fff;padding:13px 18px;font-size:14.5px;font-family:var(--sans)
  }
  .nl-form input::placeholder{color:rgba(255,255,255,.62)}
  .nl-form button{
    border-radius:999px;border:0;background:#fff;color:var(--ink);font-weight:700;font-size:14px;
    padding:13px 22px;cursor:pointer;font-family:var(--sans)
  }
  .nl-form button:hover{background:var(--coral);color:#fff}
  .nl-note{font-size:11.5px;color:#bfb4a7;margin:12px 0 0}
  .nl-done{display:none;font-size:14.5px;color:#fff;background:rgba(47,107,82,.35);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:12px 14px;margin-top:4px}

  footer.site{
    margin-top:44px;border-top:1px solid var(--line);padding:26px 0 56px;
    display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;font-size:12px;color:var(--muted)
  }
  footer.site .links{display:flex;gap:16px;flex-wrap:wrap}
  footer.site a{text-decoration:none;color:var(--muted)}
  footer.site a:hover{color:var(--ink)}

  .hidden{display:none !important}
  .fade{animation:fade .34s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  @media (max-width:960px){
    .hero{grid-template-columns:1fr;gap:22px}
    .grid{grid-template-columns:repeat(2,1fr)}
    .logo span.tag{display:none}
  }
  @media (max-width:640px){
    .wrap{padding:0 16px}
    .grid{grid-template-columns:1fr}
    .hero h1{font-size:34px}
    .topbar .sub{display:none}
    .topbar-inner{height:56px;gap:10px}
    .logo strong{font-size:17px;letter-spacing:.09em;white-space:nowrap}
    .logo .mark{width:20px;height:20px}
    .tab{padding:7px 10px;font-size:12.5px}
    .takeaway dl{grid-template-columns:1fr}
    .takeaway dt{border-top:1px solid var(--line);padding-bottom:0}
    .takeaway dd{border-top:0;padding-top:4px}
    .newsletter{padding:24px;border-radius:20px}
    .article{padding-top:22px}
    .buy-item{flex-wrap:wrap}
    .buy-item .go{width:100%;justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <button class="logo" onclick="goHome()" aria-label="SEOUL SCAN home">
      <span class="mark" aria-hidden="true"></span>
      <strong>SEOUL SCAN</strong>
      <span class="tag">K-beauty, in Korean</span>
    </button>
    <nav id="tabs" aria-label="Categories"></nav>
    <button class="sub" onclick="focusNewsletter()">Subscribe</button>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer class="site wrap">
  <div>© <span id="year"></span> SEOUL SCAN — prototype edition. Built from public Korean YouTube videos and their public comments.</div>
  <div class="links">
    <a href="#" onclick="return false">Editorial standards</a>
    <a href="#" onclick="return false">Affiliate disclosure</a>
    <a href="#" onclick="return false">Privacy</a>

turiser, saw the upload was due, and went home to wait for it. The most-liked comment of all says the humble moisturiser, not the serums, is the category that actually decides your skin — which is also the quiet thesis of the video."], "data_quality": {"comments_collected": 80, "transcript_source": "cache", "transcript_chars": 13740, "analysis_source": "editorial-review", "needs_review": false}}, {"id": "_AQnAKA1w7o", "category": "Sunscreen", "title": "Are Korean Sunscreens Safer? What 48 Products Reveal About US Filters", "title_ko": "(Eng) 2026 선크림 1위는?🥇48종 비교 추천 🔥더마, 무기, 유기, 톤업 최고의 제품은?  성분, 기기 측정 결과 I Best Sunscreens by Directorpi", "dek": "Korea's most-watched sunscreen ranking filters out five UV filters that are still standard in American sunscreens — and the comments argue about what that proves.", "hero_emoji": "☀️", "source": {"video_id": "_AQnAKA1w7o", "url": "https://www.youtube.com/watch?v=_AQnAKA1w7o", "embed_url": "https://www.youtube.com/embed/_AQnAKA1w7o", "title": "(Eng) 2026 선크림 1위는?🥇48종 비교 추천 🔥더마, 무기, 유기, 톤업 최고의 제품은?  성분, 기기 측정 결과 I Best Sunscreens by Directorpi", "channel": "디렉터파이", "channel_handle": "@director_pihyunjung", "subscribers": "구독자 103만명", "views": 286620, "views_text": "조회수 286,620회", "likes": 2184, "published": "2026. 5. 24."}, "takeaway": {"why_korea": "Korean shoppers read a sunscreen's ingredient table the way Americans read a nutrition label, so the annual ranking is a 25-minute, 48-product document rather than a top-ten list. This year's video opened by naming five UV filters being restricted in the EU and flagged as reef-harmful — including avobenzone and octocrylene, the backbone of many US sunscreens — and closed with separate winners for mineral, chemical, hybrid and tone-up formulas. It also carries a paid-ad label added after upload, which the top comments noticed.", "best_for": "Anyone buying K-beauty sunscreen abroad or from a US K-beauty retailer; there is a distinct winner for dry, oily, acne-prone and makeup-first skin.", "skip_if": "You want one single best product. The picks are split by filter type and skin type, and the most-liked complaints are about exactly that complexity and about top picks from brands nobody has heard of.", "korean_price_krw": "18,000원 (Beauty of Joseon) – 36,000원 (ISOI / d'Alba)"}, "products": [{"name_en": "Beauty of Joseon Relief Sun: Rice + Probiotics", "name_ko": "조선미녀 맑은쌀 선크림 : 고아미+프로바이오틱스 (50ml / 18,000원)", "why": "Chemical, SPF50+ PA++++, spreads evenly by hand and rated comfortable in heat with little eye sting."}, {"name_en": "numbuzin No.3 Porcelain Base-Skip Tone-Up Beige", "name_ko": "넘버즈인 3번 도자기결 톤업베이지 선크림 (50ml / 26,000원)", "why": "2026 top pick for foundation-replacement tone-up: semi-matte, sweat-resistant, cleansing oil required."}, {"name_en": "Arocell Mela Tranex Sun Serum", "name_ko": "아로셀 멜라 트라넥스 선 세럼 (40ml / 30,000원)", "why": "Dry-skin top pick built around tranexamic acid, arbutin and niacinamide for dark spots."}, {"name_en": "Fucidin Derma Trouble Zinc Calming Sunscreen", "name_ko": "후시다인 더마 트러블 징크 카밍 선크림 (50ml / 26,000원)", "why": "17% zinc oxide mineral pick for sensitive, acne-prone skin; applies like a lotion."}, {"name_en": "Innisfree Daily UV Tone-Up No Sebum", "name_ko": "이니스프리 데일리 유브이 톤업 노세범 선크림 (50ml / 20,000원)", "why": "Matte tone-up winner with no fragrance or ethanol — built for oily skin in summer."}], "sentiment": {"positive_pct": 68, "negative_pct": 20, "ad_suspicion_pct": 12, "method": "editorial review of 80 top comments, weighted by likes", "sample_size": 80, "note": "The most contested comment section of the four. Praise is for the depth; the criticism is methodological — arbitrary categories, unfamiliar winning brands, and a paid-ad label that appeared after upload."}, "comment_quotes": [{"ko": "후기에 눈시림 여부 포함해달라는 의견에 저도 한 표....!", "en": "Add 'does it sting your eyes' to the reviews — I vote for that too!", "likes": 229, "author": "@littlebylittle2023", "tone": "positive", "label": null, "note": null}, {"ko": "TOP 제품들이 너무 듣도보도 못한 브랜드뿐이라, 구입이 망설여지네요.", "en": "The top picks are all brands I've never once heard of, so I hesitate to buy.", "likes": 95, "author": "@핑크하마", "tone": "critical", "label": null, "note": null}, {"ko": "후시다인에 정착하려그랬는데 안 팔아요", "en": "I was going to settle on Fusiderm, but they don't sell it.", "likes": 13, "author": "@sophiec3650", "tone": "critical", "label": null, "note": null}, {"ko": "워터프르푸도 해주세요 작년 추천템 비플레인은 단종인가바요ㅠㅠ", "en": "Please do a waterproof edition too — last year's pick, Beplain, looks like it's been discontinued.", "likes": 37, "author": "@hjseo7845", "tone": "positive", "label": null, "note": null}, {"ko": "[2026년 06월 01일 공지 추가] 2026년 05월 21일 영상 업로드 이후, 일부 브랜드사에서 영상 사용 계약 요청이 와 일정 기간 브랜드사 제품이 노출된 구간 영상을 라이선스 계약을 통해 사용할 수 있도록 하였습니다. 이에 2026년 06월 01일, 유료 광고 표시가 없던 영상에 유료 광고 포함 표시를 추가하였습니다. 사용 기간이 끝나면, 유료 광고 포함 표시와 해당 글은 삭제됩니다. \n제품 : 아로셀 멜라 트라넥스 선 세럼", "en": "[Notice added 1 June 2026] After this video went up on 21 May 2026, some brands asked to license the segments where their products appear, so we have added a paid-promotion disclosure to a video that originally carried none.", "likes": 38, "author": "@director_pihyunjung", "tone": "ad-skeptic", "label": "Paid-ad notice", "note": "The channel's own pinned disclosure, 38 likes — the clearest document of how K-beauty review videos get retro-labelled."}], "caveat": "Several top picks are built on filters the FDA has not approved (Tinosorb S, Uvinul A Plus, Mexoryl SX), so they cannot legally be sold as US sunscreens. Importing one means the SPF on the box is a Korean test result, not an FDA one — and the zinc-only pick is the safer bet if you burn easily.", "us_search_terms": ["Beauty of Joseon Relief Sun rice probiotics", "numbuzin No 3 tone up beige sunscreen", "Arocell Mela Tranex sun serum", "Fucidin derma trouble zinc calming sunscreen"], "body": ["American sunscreen and Korean sunscreen are not the same product category wearing different packaging. The US regulates UV filters as drugs and has approved roughly a dozen, most of them decades old; Korea approves newer, photo-stable filters that also happen to feel lighter. Director Pi opens this 25-minute ranking by naming five filters that are being restricted in the EU and flagged as harmful to marine ecosystems — avobenzone, octocrylene, ethylhexyl methoxycinnamate among them — and notes that several famous Western sunscreens are built on exactly those.", "She then sorts 48 products into mineral, chemical, hybrid and tone-up groups, and picks a winner in each. For most overseas buyers the useful ones are Beauty of Joseon's Relief Sun (18,000 won, the comfortable everyday chemical option that spreads evenly by hand) and numbuzin's No.3 tone-up, which sits somewhere between sunscreen and a sheer foundation. If your skin reacts to chemical filters, the Fucidin zinc formula is the sensitive-skin pick; if you are oily, the Innisfree no-sebum tone-up is the matte one.", "The comments are worth reading precisely because they do not simply applaud. The two most-liked threads ask for eye-sting data and complain that every top pick is an unknown brand — the same objection a US reader will have, since none of these are stocked at a drugstore. A separate thread catches that the video was labelled as containing paid promotion a week after upload, which the channel explains in a pinned comment. Treat the ranking as a well-documented shortlist and check the filter list yourself before you import."], "data_quality": {"comments_collected": 80, "transcript_source": "cache", "transcript_chars": 5250, "analysis_source": "editorial-review", "needs_review": false}}, {"id": "zKktadnuSWc", "category": "Olive Young Picks", "title": "What Does a Dermatologist Buy at Olive Young for Under $10?", "title_ko": "\"이게 만원대..?\" 가성비 좋은 올리브영 필수템 5가지를 20년차 피부과 전문의가 알려드립니다", "dek": "A 20-year dermatologist picks five Olive Young items with one verb each — erase, fill, cover, smooth, protect — and 1.75M viewers rebuild their routine around it.", "hero_emoji": "🛍️", "source": {"video_id": "zKktadnuSWc", "url": "https://www.youtube.com/watch?v=zKktadnuSWc", "embed_url": "https://www.youtube.com/embed/zKktadnuSWc", "title": "\"이게 만원대..?\" 가성비 좋은 올리브영 필수템 5가지를 20년차 피부과 전문의가 알려드립니다", "channel": "피부는 성현철", "channel_handle": "@%ED%94%BC%EB%B6%80%EB%8A%94%EC%84%B1%ED%98%84%EC%B2%A0", "subscribers": "구독자 25.9만명", "views": 1755720, "views_text": "조회수 1,755,720회", "likes": 8977, "published": "2026. 8. 30."}, "takeaway": {"why_korea": "Olive Young sale weeks are a national shopping event, and dermatologist-run channels have become the trusted filter over influencer hauls. This video is built as five verbs rather than five products, so viewers can slot it into a routine they already have, and the top comment is a viewer's own five-item recap with 547 likes — the comment section writes the shopping list for everyone else.", "best_for": "Beginners assembling a first five-step routine; dry, sensitive or combination skin; anyone retinol-curious who wants the gentlest entry.", "skip_if": "You want actives at prescription strength. Everything here is deliberately mild, and the retinol pick is a low-strength starter.", "korean_price_krw": "10,000원대 (마녀공장 클렌징 오일) – 30,000원대 (테라로직 레티놀크림)"}, "products": [{"name_en": "Ma:nyo Pure Cleansing Oil", "name_ko": "마녀공장 퓨어클렌징 오일", "why": "Step one, 'erase': the cleansing oil that both the doctor and the top comment start with."}, {"name_en": "Torriden Dive-In Low Molecular Hyaluronic Ampoule", "name_ko": "토리든 다이브인 저분자 히알루론산 앰플", "why": "Step two, 'fill': hydrating layer the comments assign to dry skin, with Wellage for oily skin."}, {"name_en": "ZEROID Intensive Cream", "name_ko": "제로이드 인텐시브 크림", "why": "Step three, 'cover': the barrier cream he recommends for dry and reactive skin."}, {"name_en": "Theralogic Retinol Cream (+ Madecell moisturiser)", "name_ko": "테라로직 레티놀크림 (+ 마데셀 보습크림)", "why": "Step four, 'smooth': a low-strength retinol built as an entry point, buffered with a cream."}, {"name_en": "Round Lab Birch Juice Moisturizing Sunscreen", "name_ko": "라운드랩 자작나무 수분 선크림", "why": "Step five, 'protect': organic-filter daily sunscreen — and the one product commenters push back on hardest."}], "sentiment": {"positive_pct": 78, "negative_pct": 14, "ad_suspicion_pct": 8, "method": "editorial review of 80 top comments, weighted by likes", "sample_size": 80, "note": "Trust in the doctor is high and the purchase intent is visible. The scepticism is aimed at one product (the cleansing oil) and at copy-paste promo comments pedalling unrelated ampoules."}, "comment_quotes": [{"ko": "와 원장님 제가 쓰는 제품들 다 나오네요 ㅎㅎ 저는 이것저것 발라보고 웰라쥬와 토리든 쓰고있고 제로이드 가격때문에 안썼는데 이제까지 써본제품 중에 가장 좋았습니다. 지금 소개하신 제품들이 확실히 순한얘들이라서 맘에 듭니다 ㅎㅎ 정보 감사합니다 ㅎㅎ", "en": "Wow, doctor — almost everything I use showed up here. I've tried a bit of everything and settled on Wellage and Torriden; I'd avoided ZEROID because of the price, but it's been the best of anything I've used. It's reassuring that everything you recommend is this gentle.", "likes": 7, "author": "@후들-y8n", "tone": "positive", "label": null, "note": null}, {"ko": "마녀공장 클렌징오일 안맞는 사람은 피부 개뒤집어짐", "en": "If the Ma:nyo cleansing oil doesn't suit you, your skin flips completely.", "likes": 130, "author": "@그림-액자", "tone": "critical", "label": null, "note": null}, {"ko": "마녀공장 오일 유명해서 사봤는데 ..너무 오일리하고 텁텁함 다 자기한테 맞는게 있는듯", "en": "I bought the Ma:nyo oil because it's famous, but it's so oily and suffocating. Everyone has their own match, I guess.", "likes": 71, "author": "@kkomi6034", "tone": "critical", "label": null, "note": null}, {"ko": "자작나무는 빼세요!\n눈시림 심하고 자극적이고 차단 안되요..\n여러 선크림 동시에 같은양 발라서 테스트 하는 영상들 마니 있는데 자작나무가 거의 꼴등이에요..", "en": "Drop the birch one! It stings the eyes badly, it's irritating, and it doesn't block much — there are plenty of videos testing sunscreens side by side at the same dose, and the birch one comes near last.", "likes": 10, "author": "@moon-light-jun", "tone": "critical", "label": null, "note": "A direct counterpoint to the video's final 'protect' step, from a commenter with 10 likes."}, {"ko": "저는 주름이랑 기미가 고민이라 올리브영 세일마다 헤맸는데, 결국 피부과 실장님이 알려준 바‌‍데‍‌​콜‍린 앰플이 제일 효과 좋았어요. 탄력도 차오르고 잔주름이 옅어져서 이제 이것만 써요.", "en": "I always wandered the Olive Young sale unsure what to buy for wrinkles and pigmentation, until a clinic manager told me about this ampoule — now it's the only thing I use.", "likes": 9, "author": "@소현-z6d", "tone": "ad-skeptic", "label": "Ad spam", "note": "Copy-paste promo comment from an account plugging an unrelated ampoule; several near-identical versions rank in the top 20. Real evidence of how ad spam colonises Korean comment sections."}], "caveat": "Two cautions from the comment section itself: the Ma:nyo cleansing oil is the product most often named as a breakout trigger, and commenters argue the Round Lab birch sunscreen stings the eyes — patch test both before committing. The retinol is a starter strength; do not stack it with acids or prescription tretinoin.", "us_search_terms": ["Ma:nyo pure cleansing oil", "Torriden Dive In hyaluronic acid ampoule", "Zeroid intensive cream", "Round Lab birch juice moisturizing sunscreen"], "body": ["Most routine videos fail because they assume you are starting from nothing. This one is organised around five verbs — erase, fill, cover, smooth, protect — which is why 1.75 million people watched a dermatologist walk through five Olive Young products in seventeen minutes. Each step is one product, all of them pharmacy-adjacent and mild, and the cheapest sits in the 10,000-won range.", "The five are Ma:nyo's cleansing oil, a hyaluronic ampoule (Torriden for dry skin, Wellage for oily), ZEROID's barrier cream, a low-strength Theralogic retinol buffered with a moisturiser, and Round Lab's birch-juice sunscreen. What makes the video useful is the order: the retinol comes after the barrier cream, which is the sequencing most English-language retinol content skips.", "The comment section does two jobs at once. The most- int, Clio's Kill Lash mascara, Lilybyred's water tint — the products Korean viewers buy in multiples when the discount opens.", "What the comments reveal is how fast this converts. One of the top comments is a viewer who ordered the entire list through Olive Young's same-day delivery while the video was still playing. Another, the most-liked of all, is a precise complaint that Lilybyred's tint is missing a gasket in its cap — the kind of defect report that only a comment section of regular buyers produces."], "data_quality": {"comments_collected": 80, "transcript_source": "missing", "transcript_chars": 0, "analysis_source": "editorial-review", "needs_review": false}}]}</script>
<script>
(function(){
  "use strict";

  const AMAZON_TAG = "YOURTAG-20"; // ← 애필리에이트 태그 자리표시자
  let DATA = null;
  let state = { category: "All", articleId: null };

  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  const num = (n) => (n == null ? "—" : Number(n).toLocaleString("en-US"));
  const compact = (n) => {
    if (n == null) return "—";
    if (n >= 1e6) return (n/1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/,"") + "M";
    if (n >= 1e3) return (n/1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/,"") + "K";
    return String(n);
  };

  function articleById(id){ return (DATA?.articles || []).find(a => a.id === id); }
  function filtered(){
    const list = DATA?.articles || [];
    return state.category === "All" ? list : list.filter(a => a.category === state.category);
  }

  /* ---------------- boot ---------------- */
  async function boot(){
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    const inline = document.getElementById("kbeauty-data");
    let payload = null;
    if (inline && inline.textContent.trim() !== "null") {
      try { payload = JSON.parse(inline.textContent); } catch(e){ payload = null; }
    }
    if (!payload) {
      try {
        const res = await fetch("./articles.json", { cache: "no-store" });
        payload = await res.json();
      } catch (e) {
        document.getElementById("app").innerHTML =
          '<div style="padding:60px 0;max-width:620px"><h1 style="font-family:var(--serif);font-size:32px;margin:0 0 12px">Data file not found</h1>' +
          '<p style="color:#7a736a">This page reads <code>articles.json</code>. When a browser opens the file directly from disk it blocks that request — ' +
          'use <code>kbeauty-magazine-preview.html</code> (the single-file build) or run <code>python3 -m http.server</code> in this folder.</p></div>';
        return;
      }
    }
    DATA = payload;
    document.getElementById("year").textContent = new Date().getFullYear();
    renderTabs();
    route();
    window.addEventListener("load", () => {
      if (!state.articleId) return;
      window.scrollTo(0, 0);
    });
  }

  function renderTabs(){
    const nav = document.getElementById("tabs");
    nav.innerHTML = "";
    (DATA.categories || ["All"]).forEach(cat => {
      const b = el("button", "tab", esc(cat));
      b.type = "button";
      b.setAttribute("role","tab");
      b.setAttribute("aria-selected", String(cat === state.category));
      b.onclick = () => { state.category = cat; state.articleId = null; renderTabs(); route(); };
      nav.appendChild(b);
    });
  }

  function route(){
    const m = location.hash.match(/^#\/article\/(.+)$/);
    if (m && articleById(m[1])) { state.articleId = m[1]; renderArticle(articleById(m[1])); }
    else { state.articleId = null; renderHome(); }
    window.scrollTo(0, 0);
    requestAnimationFrame(() => window.scrollTo(0, 0));
    setTimeout(() => { if (window.scrollY > 4) window.scrollTo(0, 0); }, 60);
  }
  window.addEventListener("hashchange", route);
  function goHome(){ location.hash = ""; }
  function openArticle(id){ location.hash = "#/article/" + id; }
  function focusNewsletter(){
    if (state.articleId) goHome();
    setTimeout(() => {
      const f = document.getElementById("nl-email");
      if (f) { f.scrollIntoView({behavior:"smooth", block:"center"}); f.focus({preventScroll:true}); }
    }, 80);
  }

  /* ---------------- home ---------------- */
  function miniMeter(s){
    const p = s?.positive_pct ?? 0, n = s?.negative_pct ?? 0, a = s?.ad_suspicion_pct ?? 0;
    return '<div class="meter-mini" aria-hidden="true"><i class="p" style="width:'+p+'%"></i><i class="n" style="width:'+n+'%"></i><i class="a" style="width:'+a+'%"></i></div>';
  }

  function renderHome(){
    const app = document.getElementById("app");
    app.innerHTML = "";
    const list = filtered();
    const lead = list[0];

    const edition = el("div","edition");
    edition.innerHTML =
      '<div><span class="dot"></span>' + esc(DATA.site?.edition || "Prototype Edition") +
      '<span class="dot"></span>' + (list.length) + (list.length === 1 ? ' story · ' : ' stories · ') + 'Korean comments included</div>' +
      '<div>Reading time ~4 min each · US edition</div>';
    app.appendChild(edition);

    if (lead) {
      const hero = el("section","hero fade");
      hero.innerHTML =
        '<div>' +
          '<div class="kicker">' + esc(lead.category) + ' · from Korean YouTube</div>' +
          '<h1>' + esc(lead.title) + '</h1>' +
          '<p class="dek">' + esc(lead.dek) + '</p>' +
          '<div class="meta">' +
            '<span class="pill">💬 <b>' + num(lead.data_quality?.comments_collected) + '</b> Korean comments read</span>' +
            '<span class="pill">▶ <b>' + compact(lead.source?.views) + '</b> views</span>' +
            '<span class="pill">' + esc(lead.source?.channel || "") + '</span>' +
          '</div>' +
          '<div class="next"><button class="btn coral" onclick="openArticle(\'' + esc(lead.id) + '\')">Read the story →</button>' +
          '<a class="btn ghost" href="' + esc(lead.source?.url || "#") + '" target="_blank" rel="noopener">Watch the video</a></div>' +
        '</div>' +
        '<div class="hero-art"><div class="big">' + esc(lead.hero_emoji || "🧴") + '</div>' +
          '<div class="stamp">' + esc(lead.title_ko || "") + '</div></div>';
      app.appendChild(hero);
    }

    const head = el("div","section-head");
    head.innerHTML = '<h2>' + (state.category === "All" ? "Latest" : esc(state.category)) + '</h2><div class="rule"></div><div class="count">' + list.length + ' articles</div>';
    app.appendChild(head);

    const grid = el("div","grid");
    list.forEach(a => {
      const card = el("article","card fade");
      card.innerHTML =
        '<div class="thumb"><span class="cat">' + esc(a.category) + '</span>' + esc(a.hero_emoji || "🧴") + '</div>' +
        '<div class="body">' +
          '<h3>' + esc(a.title) + '</h3>' +
          '<p>' + esc(a.dek) + '</p>' +
          miniMeter(a.sentiment) +
          '<div class="foot"><span>' + compact(a.source?.views) + ' views</span><span>·</span><span>' + num(a.data_quality?.comments_collected) + ' comments</span></div>' +
        '</div>';
      card.onclick = () => openArticle(a.id);
      card.tabIndex = 0;
      card.setAttribute("role","link");
      card.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openArticle(a.id); } };
      grid.appendChild(card);
    });
    app.appendChild(grid);
    app.appendChild(newsletterBlock());
  }

  /* ---------------- article ---------------- */
  function quoteBlock(q){
    const tone = q.tone || "positive";
    const label = q.label || (tone === "critical" ? "Critical" : tone === "ad-skeptic" ? "Ad-skeptic" : "Positive");
    const likeTxt = q.likes ? "♥ " + num(q.likes) : "♥ —";
    return '<figure class="quote" data-tone="' + esc(tone) + '">' +
      '<p class="ko">' + esc(q.ko) + '</p>' +
      '<p class="en">“' + esc(q.en) + '”</p>' +
      '<div class="meta"><span class="chip ' + (tone === "critical" ? "critical" : tone === "ad-skeptic" ? "ad" : "") + '">' + label + '</span>' +
      '<span>' + likeTxt + '</span><span>·</span><span>' + esc(q.author || "YouTube comment") + '</span></div>' +
      (q.note ? '<p class="note">' + esc(q.note) + '</p>' : '') +
      '</figure>';
  }

  function renderArticle(a){
    const app = document.getElementById("app");
    app.innerHTML = "";
    const s = a.sentiment || {};
    const t = a.takeaway || {};
    const qs = a.comment_quotes || [];
    const sq = a.source || {};

    const art = el("article","article fade");
    art.innerHTML =
      '<button class="backlink" onclick="goHome()">← All stories</button>' +
      '<div class="kicker">' + esc(a.category) + ' · ' + esc(sq.channel || "") + '</div>' +
      '<h1>' + esc(a.title) + '</h1>' +
      '<p class="dek">' + esc(a.dek) + '</p>' +
      '<div class="byline">' +
        '<span class="chip">' + esc(sq.published || "") + '</span>' +
        '<span class="src">Original: <b>' + esc(sq.title || "") + '</b></span>' +
        '<span class="src" style="margin-left:auto">' + compact(sq.views) + ' views · ♥ ' + num(sq.likes) + '</span>' +
      '</div>' +

      // 1. 30-second takeaway
      '<section class="block">' +
        '<div class="block-head"><span class="n">1</span><h2>The 30-second takeaway</h2></div>' +
        '<div class="takeaway"><dl>' +
          '<dt>Why Korea</dt><dd>' + esc(t.why_korea || "—") + '</dd>' +
          '<dt>Best for</dt><dd>' + esc(t.best_for || "—") + '</dd>' +
          '<dt>Skip if</dt><dd>' + esc(t.skip_if || "—") + '</dd>' +
          '<dt>Korean price</dt><dd>' + esc(t.korean_price_krw || "—") + '</dd>' +
        '</dl></div>' +
      '</section>' +

      // 2. body
      ((a.body && a.body.length) ?
        '<section class="block bodycopy">' + a.body.map(p => '<p>' + esc(p) + '</p>').join("") + '</section>' : '') +

      // 3. sentiment meter
      '<section class="block">' +
        '<div class="block-head"><span class="n">2</span><h2>Korean comment sentiment meter</h2></div>' +
        '<div class="meter-card">' +
          '<div class="meter-top">' +
            '<div class="big">' + num(s.sample_size) + '<small>comments read</small></div>' +
            '<div style="text-align:right;font-size:12px;color:var(--muted)">' + esc(s.method || "") + '</div>' +
          '</div>' +
          '<div class="bar" role="img" aria-label="Positive ' + (s.positive_pct||0) + ' percent, critical ' + (s.negative_pct||0) + ' percent, ad-skeptic ' + (s.ad_suspicion_pct||0) + ' percent">' +
            '<i class="p" style="width:' + (s.positive_pct||0) + '%">' + (s.positive_pct>=12 ? (s.positive_pct||0)+'%' : '') + '</i>' +
            '<i class="n" style="width:' + (s.negative_pct||0) + '%">' + (s.negative_pct>=12 ? (s.negative_pct||0)+'%' : '') + '</i>' +
            '<i class="a" style="width:' + (s.ad_suspicion_pct||0) + '%">' + (s.ad_suspicion_pct>=12 ? (s.ad_suspicion_pct||0)+'%' : '') + '</i>' +
          '</div>' +
          '<div class="legend">' +
            '<span><i style="background:var(--pos)"></i>Positive ' + (s.positive_pct||0) + '%</span>' +
            '<span><i style="background:var(--neg)"></i>Critical / disappointed ' + (s.negative_pct||0) + '%</span>' +
            '<span><i style="background:var(--ad)"></i>Sponsorship suspicion ' + (s.ad_suspicion_pct||0) + '%</span>' +
          '</div>' +
          (s.note ? '<p class="meter-note">' + esc(s.note) + '</p>' : '') +
        '</div>' +
        '<div class="quotes" style="margin-top:16px">' + qs.map(quoteBlock).join("") + '</div>' +
      '</section>' +

      // 4. buy
      '<section class="block">' +
        '<div class="block-head"><span class="n">3</span><h2>Where to buy in the US</h2></div>' +
        '<div class="buy">' + (a.products||[]).map(p => {
          const q = encodeURIComponent(p.name_en + " korean");
          return '<div class="buy-item">' +
            '<div class="nm"><b>' + esc(p.name_en) + '</b>' +
            '<span>' + esc(p.name_ko || "") + '</span>' +
            '<em>' + esc(p.why || "") + '</em></div>' +
            '<a class="go" href="https://www.amazon.com/s?k=' + q + '&tag=' + encodeURIComponent(AMAZON_TAG) + '" target="_blank" rel="noopener sponsored">Find on Amazon ↗</a>' +
          '</div>';
        }).join("") + '</div>' +
        (a.caveat ? '<div class="caveat"><b>One caution:</b> ' + esc(a.caveat) + '</div>' : '') +
        '<p class="aff-note">Amazon links are affiliate placeholders (<code>tag=' + esc(AMAZON_TAG) + '</code>). Prices shown are Korean retail; US imports usually run higher.</p>' +
      '</section>' +

      // 5. source
      '<section class="block">' +
        '<div class="block-head"><span class="n">4</span><h2>Source &amp; creator credit</h2></div>' +
        '<div class="source-card">' +
          '<div class="row">' +
            '<div class="thumb-sm">' + esc(a.hero_emoji || "▶") + '</div>' +
            '<div class="t"><b>' + esc(sq.title || "") + '</b>' +
              '<span>' + esc(sq.channel || "") + (sq.subscribers ? " · " + esc(sq.subscribers.split("구독자")[1] ? "구독자 " + sq.subscribers.split("구독자")[1].trim() : sq.subscribers) : "") + ' · ' + esc(sq.published || "") + '</span></div>' +
            '<a class="go" style="text-decoration:none;background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:600" href="' + esc(sq.url || "#") + '" target="_blank" rel="noopener">Watch on YouTube ↗</a>' +
          '</div>' +
          '<div class="embed" id="embed-box" data-src="' + esc(sq.embed_url || "") + '" data-title="' + esc(sq.title || "") + '" data-id="' + esc(sq.video_id || "") + '">' +
            '<button class="embed-facade" onclick="loadEmbed(this)" aria-label="Play the original video">' +
              '<span class="embed-play">▶</span>' +
              '<span class="embed-label">Watch the original · ' + esc(sq.channel || "YouTube") + '</span>' +
            '</button>' +
          '</div>' +
          '<div class="quality">' +
            '<span>Data: ' + num(a.data_quality?.comments_collected) + ' public comments</span>' +
            '<span>Transcript: ' + esc(a.data_quality?.transcript_source === "cache" ? "captured from the YouTube transcript panel" : a.data_quality?.transcript_source === "yt-dlp" ? "captured with yt-dlp" : "not captured — description used") + '</span>' +
            '<span>Analysis: ' + esc(a.data_quality?.analysis_source || "editorial") + '</span>' +
            '<span>Video ID: ' + esc(sq.video_id) + '</span>' +
          '</div>' +
        '</div>' +
        '<p class="aff-note" style="margin-top:14px">All quotations are public comments shown verbatim in Korean with an English translation by our editors. Product names and prices are as stated in the original video.</p>' +
      '</section>' +

      '<div class="next"><button class="btn" onclick="goHome()">← Back to all stories</button>' +
      '<button class="btn ghost" onclick="focusNewsletter()">Get the weekly edit</button></div>';

    app.appendChild(art);
    app.appendChild(newsletterBlock());
  }

  /* ---------------- newsletter ---------------- */
  function newsletterBlock(){
    const box = el("section","newsletter");
    box.id = "newsletter";
    box.innerHTML =
      '<h3>The Friday edit</h3>' +
      '<p>One email a week: the Korean videos worth watching, the comments that tell you what Koreans actually think, and what it costs to try it in the US.</p>' +
      '<form class="nl-form" onsubmit="return subscribe(event)">' +
        '<input id="nl-email" type="email" required placeholder="you@example.com" aria-label="Email address" />' +
        '<button type="submit">Subscribe free</button>' +
      '</form>' +
      '<p class="nl-note">Prototype form — nothing is sent anywhere yet. No spam, unsubscribe anytime.</p>' +
      '<div class="nl-done" id="nl-done">✓ You are on the list. (Demo only — no email was sent.)</div>';
    return box;
  }
  function subscribe(e){
    e.preventDefault();
    const f = e.target, done = document.getElementById("nl-done");
    const email = document.getElementById("nl-email");
    if (!email || !email.value) return false;
    f.classList.add("hidden");
    if (done) done.style.display = "block";
    return false;
  }

  /* 유튜브 임베드는 클릭할 때만 불러온다 — 오프라인/느린 회로에서 빈 오류 박스를 피하려는 장치 */
  function loadEmbed(btn){
    const box = btn.closest(".embed");
    if (!box) return;
    const src = box.getAttribute("data-src");
    const title = box.getAttribute("data-title") || "YouTube video";
    if (!src) return;
    const iframe = document.createElement("iframe");
    iframe.src = src + "?rel=0&autoplay=1";
    iframe.title = title;
    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    iframe.allowFullscreen = true;
    iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
    box.innerHTML = "";
    box.appendChild(iframe);
  }

  window.subscribe = subscribe;
  window.loadEmbed = loadEmbed;
  window.openArticle = openArticle;
  window.goHome = goHome;
  window.focusNewsletter = focusNewsletter;

  boot();
})();
</script>
</body>
</html>
